<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06061a">
<title>Free Fire India Tournament</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
<style>
:root{
  --bg: #060608;
  --bg-gradient: radial-gradient(circle at top, #2a0000 0%, #060608 70%);
  --card-bg: #111114;
  --card-bg-gradient: linear-gradient(145deg, #1a1a1d, #0d0d0f);
  --panel-bg: #1e1e24;
  --primary: #ff3c00;
  --primary-glow: rgba(255, 60, 0, 0.6);
  --secondary: #ff8c00;
  --text-main: #f4f4f5;
  --text-muted: #7a7a85;
  --border: #2a2a2e;
  --border-glow: rgba(255, 60, 0, 0.4);
  --ok: #10b981;
  --warn: #f59e0b;
  --bad: #ef4444;
  --grad: linear-gradient(135deg, #ff3c00 0%, #ff0000 100%);
  --grad-deep: linear-gradient(135deg, #0a0a0c 0%, #2a0000 100%);
  --shadow: 0 10px 30px rgba(0,0,0,0.8);
  --shadow-sm: 0 4px 14px rgba(0,0,0,0.6);
  --nav-h: 70px;
  --font-head: 'Orbitron', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family: var(--font-body);
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  background-color: var(--bg);
  background-image: linear-gradient(rgba(255,60,0,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,60,0,0.03) 1px, transparent 1px);
  background-size: 20px 20px;
}
img{max-width:100%;display:block}
button,input,select,textarea{font-family:var(--font-body);font-size:15px; font-weight: 600;}
button{cursor:pointer}
a{color:var(--secondary);text-decoration:none}

.app{max-width:540px;margin:0 auto;padding-bottom:calc(var(--nav-h) + 34px);min-height:100vh}

/* --- HEADER --- */
#appHeader{
  position:sticky;top:0;z-index:60;
  background:rgba(10, 10, 12, 0.95);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom: 1px solid rgba(255,60,0,0.2);
  box-shadow: 0 4px 20px rgba(0,0,0,0.8);
}
.hdr{max-width:540px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px; position:relative;height:66px;}
.hdr::after{content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);width: 40%; height: 2px; background: var(--grad); box-shadow: 0 0 10px var(--primary);}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:46px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);border: 2px solid var(--primary); box-shadow: inset 0 0 10px var(--primary-glow);}
.logo img{width:100%;height:100%;object-fit:cover;}
.brand-name{font-family: var(--font-head); font-size:13px;font-weight:800;letter-spacing:1px;line-height:1.1;color:var(--text-main)}
.brand-sub{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--secondary);margin-top:2px}
.hdr-actions{display:flex;align-items:center;gap:12px}
.icon-btn{position:relative;width:38px;height:38px;border:1px solid var(--border);background:var(--card-bg);display:grid;place-items:center;color:var(--text-main);clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);transition:transform .15s ease, background .15s ease, border-color .15s ease;}
.icon-btn:active{transform:scale(.93);background:var(--panel-bg); border-color: var(--primary)}
.dot-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg); box-shadow: 0 0 10px var(--primary-glow);}

.view{display:none;padding:14px 16px 10px}
.view.active{display:block;animation:fadeUp .28s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* --- CYBERPUNK CARDS --- */
.card-wrapper {position: relative;margin-bottom: 14px;filter: drop-shadow(0 0 8px rgba(255,60,0,0.2));}
.card-wrapper::before {content: ''; position: absolute; inset: 0;background: linear-gradient(135deg, var(--primary) 0%, rgba(255,60,0,0.1) 50%, var(--primary) 100%);clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);z-index: -1;}
.card {background: var(--card-bg-gradient);border: none;padding: 18px 16px;position: relative;overflow: hidden;clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);}
.card.flat { filter: none; }
.card.flat::before { display: none; }
.card-hero{ background: var(--grad-deep); position:relative; overflow:hidden; }
.card-hero::after{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,60,0,.25) 0%,rgba(255,60,0,0) 70%);}
.hero-inner{position:relative;z-index:2}

/* --- HERO BANNER --- */
.hero-banner {position: relative;height: 160px;margin-bottom: 16px;clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);background: url('logo.jpg') center/cover;display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px;}
.hero-banner::before {content: ''; position: absolute; inset: 0;background: linear-gradient(to top, rgba(10,10,12,1) 0%, rgba(255,60,0,0.4) 50%, transparent 100%);}
.hero-banner::after {content: ''; position: absolute; inset: 0;border: 2px solid var(--primary); box-shadow: inset 0 0 20px var(--primary-glow);clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);pointer-events: none;}
.hero-dots { display: flex; gap: 6px; position: relative; z-index: 2;}
.hero-dot { width: 30px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px;}
.hero-dot.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); }

/* --- FILTER TABS --- */
.filter-tabs {display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 6px;}
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-btn {display: flex; align-items: center; gap: 8px;background: rgba(0,0,0,0.6); border: 1px solid var(--border);color: var(--text-muted); padding: 8px 16px; border-radius: 30px;font-size: 13px; font-weight: 700; letter-spacing: 0.5px; flex: none;transition: all 0.3s ease;}
.filter-btn.active {border-color: var(--primary); color: #fff;box-shadow: 0 0 10px var(--primary-glow), inset 0 0 10px var(--primary-glow);}
.filter-btn svg { fill: currentColor; }

/* --- TOURNAMENT CARD --- */
.cyber-card { position: relative; margin-bottom: 16px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8)); }
.cyber-card-bg {background: linear-gradient(135deg, #ff3c00 0%, #2a0000 100%);clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);padding: 2px; }
.cyber-card-inner {background: #151518;background-image: linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111), linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111);background-size: 10px 10px; background-position: 0 0, 5px 5px;clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);display: flex; padding: 12px; gap: 12px;}
.cc-left { width: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.cc-avatar-wrap {width: 60px; height: 60px; border-radius: 50%;background: #222; border: 2px solid var(--border);display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 15px #000;}
.cc-avatar-wrap svg { width: 40px; height: 40px; fill: #444; }
.cc-lines { width: 40px; height: 6px; background: #333; border-radius: 3px; }
.cc-mid { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.cc-title { font-family: var(--font-head); font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;}
.cc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px;}
.cc-stat-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--text-muted); }
.cc-stat-item svg { width: 14px; height: 14px; fill: var(--primary); }
.cc-progress-wrap { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-bottom: 6px; border: 1px solid #333;}
.cc-progress { height: 100%; background: linear-gradient(90deg, #ff8c00, #ff3c00); box-shadow: 0 0 10px var(--primary); }
.cc-slots { font-size: 10px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px;}
.cc-btn {margin-top: 8px; background: transparent; border: 1px solid var(--primary);color: var(--primary); padding: 6px 12px; font-size: 12px; font-weight: 800;clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);text-align: center; transition: 0.2s; box-shadow: inset 0 0 10px rgba(255,60,0,0.2);}
.cc-btn:active { background: var(--primary); color: #000; }
.cc-right { width: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hex-badge {width: 36px; height: 40px; background: #222; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);display: flex; align-items: center; justify-content: center;border: 2px solid var(--primary); box-shadow: 0 0 10px var(--primary-glow);}
.hex-badge svg { width: 20px; height: 20px; fill: var(--primary); }

/* --- BUTTONS --- */
.btn{border:1px solid transparent;border-radius:0;padding:12px 18px;font-weight:700;font-size:15px;background:var(--panel-bg);color:var(--text-main);transition:all .2s ease;display:inline-flex;align-items:center;justify-content:center;gap:7px;clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 0 15px var(--primary-glow); border: none; font-family: var(--font-head); letter-spacing: 1px;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-main)}
.btn-ghost:active{background:var(--panel-bg); border-color: var(--primary);}
.btn-danger{background:linear-gradient(135deg,#ff3c00,#a00000);color:#fff;}
.btn-ok{background:linear-gradient(135deg,#10b981,#047857);color:#fff;}
.btn-sm{padding:8px 13px;font-size:13px;}
.btn-block{width:100%}
.btn:disabled{opacity:.5;filter:grayscale(.8);pointer-events:none}

/* --- BOTTOM NAV --- */
#bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:70;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(10, 10, 12, 0.95);backdrop-filter:blur(18px);border-top: 1px solid rgba(255,60,0,0.2);display:flex;align-items:stretch;justify-content:space-around;box-shadow: 0 -5px 20px rgba(0,0,0,0.8);}
.nav-inner{max-width:540px;margin:0 auto;display:flex;width:100%}
.nav-item{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-muted);font-size:10px;font-weight:700;letter-spacing:1px;padding:6px 0;position:relative;transition:all .2s ease; font-family: var(--font-head);}
.nav-item:not(:last-child)::after {content: ''; position: absolute; right: 0; top: 25%; height: 50%; width: 1px;background: rgba(255,255,255,0.05); transform: skewX(-15deg);}
.nav-item svg { fill: var(--text-muted); transition: all .2s; width: 22px; height: 22px;}
.nav-item.active{color:var(--primary); text-shadow: 0 0 8px var(--primary-glow);}
.nav-item.active svg { fill: var(--primary); filter: drop-shadow(0 0 6px var(--primary)); }
.nav-item.active::before{content:"";position:absolute;top:0;width:30px;height:2px;background:var(--grad); box-shadow: 0 0 10px var(--primary);}

/* --- OTHER UI COMPONENTS --- */
.empty{text-align:center;padding:34px 16px;color:var(--text-muted)}
.empty-ic{width:60px;height:60px;background:var(--panel-bg);display:grid;place-items:center;margin:0 auto 12px;color:var(--primary); border: 1px solid var(--border); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);}
.empty-t{font-weight:700;color:var(--text-main);font-size:15px;margin-bottom:4px}
.empty-s{font-size:13px;font-weight:600}
.avatar{border-radius:50%;object-fit:cover;border:2px solid var(--primary);box-shadow:0 0 10px var(--primary-glow);flex:none}
.avatar-txt{display:grid;place-items:center;background:var(--panel-bg);color:var(--primary);font-weight:800;letter-spacing:.5px}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--border);padding:10px 8px;text-align:center; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);}
.stat-v{font-family: var(--font-head); font-size:18px;font-weight:800;line-height:1.1; color: var(--text-main)}
.stat-l{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);margin-top:3px}
.stat-card{background:var(--card-bg);border:1px solid var(--border);padding:12px 8px;text-align:center;box-shadow:var(--shadow-sm);clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase; border:1px solid transparent; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);}
.chip-blue{background:rgba(255,60,0,0.1);border-color:rgba(255,60,0,0.3);color:var(--primary)}
.chip-green{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);color:var(--ok)}
.chip-orange{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.3);color:var(--warn)}
.chip-red{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:var(--bad)}
.chip-gray{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1);color:var(--text-muted)}
.field{margin-bottom:13px}
.label{display:block;font-size:13px;font-weight:700;color:var(--text-main);margin-bottom:6px;letter-spacing:.5px;}
.input{width:100%;padding:12px 14px;border:1px solid var(--border);background:var(--bg);color:var(--text-main);outline:none;transition:border .15s,background .15s; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);}
.input:focus{border-color:var(--primary);background:var(--panel-bg);box-shadow:0 0 10px var(--primary-glow)}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 12px}
.sec-title{font-family: var(--font-head); font-size:15px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:7px;color:var(--text-main); text-transform: uppercase;}
.sec-link{font-size:13px;font-weight:700;color:var(--secondary); font-family: var(--font-head);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.flex{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.center{text-align:center}
.muted{color:var(--text-muted)}
.small{font-size:12px}
.bold{font-weight:800}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:300;display:flex;align-items:flex-end;justify-content:center;animation:bdIn .2s ease;}
@keyframes bdIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:540px;background:var(--card-bg);border-bottom: none;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:modalIn .28s cubic-bezier(.22,1,.36,1); clip-path: polygon(20px 0, 100% 0, 100% 100%, 0 100%, 0 20px); border-top: 2px solid var(--primary); box-shadow: 0 -10px 30px rgba(255,60,0,0.2);}
@keyframes modalIn{from{transform:translateY(60px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{font-family: var(--font-head); font-size:18px;font-weight:800;margin-bottom:14px;color:var(--primary);display:flex;align-items:center;gap:8px; text-transform: uppercase;}
.modal-body{font-size:14px;color:var(--text-main);line-height:1.6; white-space: pre-line;}
.modal-foot{display:flex;gap:10px;margin-top:18px}
.modal-foot .btn{flex:1}
.grabber{width:42px;height:5px;border-radius:99px;background:var(--border);margin:-6px auto 14px}

/* Auth */
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:26px 18px 40px;max-width:540px;margin:0 auto}
.auth-logo{width:100px;height:115px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto 16px; box-shadow:0 0 30px var(--primary-glow); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); border: 3px solid var(--primary);}
.auth-logo img{width:100%;height:100%;object-fit:cover;}
.auth-title{font-family: var(--font-head); text-align:center;font-size:24px;font-weight:800;letter-spacing:2px;color:var(--text-main);margin-bottom:4px; text-transform: uppercase;}
.auth-sub{text-align:center;font-size:13px;font-weight:700;letter-spacing:3px;color:var(--secondary);margin-bottom:22px;text-transform:uppercase}
.tabs{display:flex;background:var(--bg);border:1px solid var(--border);padding:4px;margin-bottom:18px}
.tab{flex:1;border:none;background:none;padding:10px;font-weight:700;font-size:14px;color:var(--text-muted);transition:.2s; text-transform: uppercase; font-family: var(--font-head);}
.tab.active{background:var(--panel-bg);color:var(--primary);box-shadow:0 0 10px var(--primary-glow); border: 1px solid var(--primary);}

/* Admin */
.admin-top{background:var(--grad-deep);color:var(--text-main);padding:16px 16px 18px;margin:-14px -16px 14px; border-bottom: 1px solid var(--border);}
.admin-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.admin-tabs::-webkit-scrollbar{display:none}
.atab{flex:none;border:1px solid var(--border);background:var(--bg);color:var(--text-main);padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap; transition: all .2s; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);}
.atab.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 0 15px var(--primary-glow)}
.mini-table{width:100%;border-collapse:collapse;font-size:13px}
.mini-table th{text-align:left;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:6px 6px;border-bottom:1px solid var(--border)}
.mini-table td{padding:8px 6px;border-bottom:1px solid var(--border);font-weight:600;color:var(--text-main);vertical-align:middle}
.notice{border-radius:0;padding:12px 14px;font-size:13px;font-weight:600;line-height:1.5;border:1px dashed;margin-bottom:14px; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);}
.notice-warn{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.4);color:var(--warn)}
.notice-info{background:rgba(255,60,0,0.1);border-color:rgba(255,60,0,0.4);color:var(--primary)}
.notice-bad{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.4);color:var(--bad)}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none;padding-bottom:0}
.list-row:first-child{padding-top:0}
.list-main{flex:1;min-width:0}
.list-title{font-size:15px;font-weight:700;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-sub{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-badge{width:32px;height:32px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--panel-bg);color:var(--text-muted);flex:none; border: 1px solid var(--border); clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);}
.rank-1{background:linear-gradient(135deg,#ff8c00,#ff3c00);color:#fff;box-shadow:0 0 15px rgba(255,60,0,0.5); border: none;}

  if (diff <= 0) return { html: '⚡ STARTING SOON' };
  const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000);
  return { html: '⏱ ' + (d > 0 ? d + 'd ' : '') + pad2(h) + 'h ' + pad2(m) + 'm' };
}

function setAuthTab(tab) { $('#tabLogin').classList.toggle('active', tab === 'login'); $('#tabRegister').classList.toggle('active', tab === 'register'); $('#authLoginForm').style.display = tab === 'login' ? 'block' : 'none'; $('#authRegisterForm').style.display = tab === 'register' ? 'block' : 'none'; }
function directLogin() {
  const mobile = $('#loginMobile').value.trim(), pwd = $('#loginPassword').value;
  const user = DB.users.find(u => u.mobile === mobile);
  if (!user || user.passwordHash !== hashPassword(pwd)) return toast('Invalid credentials', 'bad');
  session = { userId: user.id }; saveSession(); toast('Welcome back!'); go(user.role === 'admin' ? 'admin' : 'home');
}
function directRegister() {
  const name = $('#regName').value.trim(), game = $('#regGame').value.trim(), ffUid = $('#regUid').value.trim(), mobile = $('#regMobile').value.trim(), pwd = $('#regPassword').value;
  if (!name || !game || !ffUid || !mobile || pwd.length < 4) return toast('Fill all fields', 'bad');
  if (DB.users.some(u => u.mobile === mobile)) return toast('Mobile already registered', 'bad');
  const user = { id: uid('u'), name, gameName: game, ffUid, mobile, passwordHash: hashPassword(pwd), role: 'player', availCoins: 0, winCoins: 0, matches: 0, wins: 0, points: 0, kills: 0 };
  DB.users.push(user); session = { userId: user.id }; saveDB(); saveSession(); toast('Account created!'); go('home');
}
function forgotAccount() {
  openModal('<div class="modal-head">Password Reset</div><div class="modal-body">Enter your details. We will open WhatsApp with a message.</div><div class="field mt16"><label class="label">Your Name</label><input class="input" id="fpName" maxlength="40" placeholder="Name"></div><div class="field"><label class="label">Free Fire UID</label><input class="input" id="fpUid" maxlength="12" placeholder="UID"></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">CANCEL</button><button class="btn btn-ok" onclick="sendForgotWhatsApp()">SEND VIA WHATSAPP</button></div>');
}
function sendForgotWhatsApp() {
  const name = $('#fpName').value.trim(), ffUid = $('#fpUid').value.trim();
  if (name.length < 2 || !/^\d{6,12}$/.test(ffUid)) return toast('Enter valid details', 'bad');
  const msg = 'Hello Admin 👋\n\n📱 App: Free Fire India Tournament\n👤 Name: ' + name + '\n🎮 FF UID: ' + ffUid + '\n\n🔑 Please forget my password and help me reset it.';
  window.open('https://wa.me/917699883020?text=' + encodeURIComponent(msg), '_blank'); closeModal();
}

function go(view, param) {
  if (!currentUser() && view !== 'auth') view = 'auth';
  state.view = view; state.param = param || null;
  renderView(view);
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  const isAuth = view === 'auth', isAdmin = view === 'admin';
  $('#appHeader').style.display = isAuth ? 'none' : 'block';
  $('#bottomNav').style.display = (isAuth || isAdmin) ? 'none' : 'block';
  $('#contactFab').style.display = isAdmin ? 'none' : 'grid';
  updateHeader(); updateAllCountdowns(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function updateHeader() {
  const u = currentUser(); if (!u) return;
  $('#hdrAvatar').innerHTML = avatarHTML(u, 36);
}
function renderView(view) {
  if (view === 'home') renderHome();
  else if (view === 'tournaments') renderTournaments();
  else if (view === 'admin') renderAdmin();
  else if (view === 'wallet') renderWallet();
  else if (view === 'profile') renderProfile();
}
function avatarHTML(u, s) { return '<div class="avatar avatar-txt" style="width:' + s + 'px;height:' + s + 'px;font-size:' + (s*0.4) + 'px">' + esc(u.name[0]) + '</div>'; }

function renderHome() {
  const u = currentUser();
  let html = '<div class="hero-banner"><div class="hero-dots"><div class="hero-dot active"></div></div></div>';
  html += '<div class="card-wrapper"><div class="card card-hero"><div class="hero-inner"><div class="flex" style="gap:12px">' + avatarHTML(u, 52) + '<div><div style="font-size:12px;font-weight:700;color:var(--secondary)">PLAYER PROFILE</div><div style="font-family:var(--font-head);font-size:20px;font-weight:800;">' + esc(u.name) + '</div><div style="font-size:13px;color:var(--text-muted)">' + esc(u.gameName) + ' · UID ' + esc(u.ffUid) + '</div></div></div></div></div></div>';
  html += '<div class="sec-head"><div class="sec-title">' + icon('trophy', 20) + ' TOURNAMENTS</div></div>';
  if(DB.tournaments.length === 0) html += '<div class="empty">No tournaments available.</div>';
  else DB.tournaments.forEach(t => {
    html += '<div class="cyber-card" onclick="alert(\'Tournament Details Coming Soon!\')"><div class="cyber-card-bg"><div class="cyber-card-inner"><div class="cc-mid"><div class="cc-title">' + esc(t.name) + '</div><div class="cc-stats"><div class="cc-stat-item">' + icon('trophy', 14) + t.prize + '</div><div class="cc-stat-item">' + icon('clock', 14) + fmtDate(t.date) + '</div></div><div class="mt8"><span class="countdown-chip" data-cd-tid="' + t.id + '">—</span></div></div></div></div></div>';
  });
  $('#view-home').innerHTML = html;
}
function renderTournaments() { go('home'); }
function renderWallet() { $('#view-wallet').innerHTML = '<div class="sec-head"><div class="sec-title">Wallet</div></div><div class="card-wrapper"><div class="card">Coming soon...</div></div>'; }
function renderProfile() { $('#view-profile').innerHTML = '<div class="sec-head"><div class="sec-title">Profile</div></div><div class="card-wrapper"><div class="card"><button class="btn btn-ghost btn-block" onclick="session=null;saveSession();go(\'auth\')">LOGOUT</button></div></div>'; }

// Admin Panel
function renderAdmin() {
  let html = '<div class="admin-top"><div class="between"><div><div style="font-size:20px;font-weight:800;font-family:var(--font-head)">ADMIN PANEL</div></div><button class="btn btn-sm btn-ghost" onclick="go(\'home\')">EXIT</button></div></div>';
  html += '<div class="card-wrapper"><div class="card"><div class="bold" style="margin-bottom:10px">Admin Dashboard</div><p class="small muted">Manage your tournaments and wallet here.</p><button class="btn btn-primary btn-block" onclick="alert(\'Coming Soon\')">Manage Tournaments</button></div></div>';
  $('#view-admin').innerHTML = html;
}

function init() {
  loadDB(); startCountdownTicker();
  const navItems = [{ key: 'home', label: 'HOME', icon: 'home' }, { key: 'tournaments', label: 'ARENA', icon: 'trophy' }, { key: 'wallet', label: 'WALLET', icon: 'wallet' }, { key: 'profile', label: 'PROFILE', icon: 'user' }];
  $('#navInner').innerHTML = navItems.map(n => '<button class="nav-item" data-nav="' + n.key + '" onclick="go(\'' + n.key + '\')">' + icon(n.icon, 22) + '<span>' + n.label + '</span></button>').join('');
  if (currentUser()) go(currentUser().role === 'admin' ? 'admin' : 'home'); else go('auth');
}
window.go = go;
window.directLogin = directLogin;
window.directRegister = directRegister;
window.forgotAccount = forgotAccount;
window.sendForgotWhatsApp = sendForgotWhatsApp;
window.setAuthTab = setAuthTab;
window.closeModal = closeModal;

init();
</script>
</body>
</html>
