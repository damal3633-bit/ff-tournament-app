<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06061a">
<title>Free Fire India Tournament</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
<style>
:root{
  --bg: #06061a;
  --bg-gradient: radial-gradient(ellipse at 15% -10%, rgba(124,58,237,0.45) 0%, transparent 55%), radial-gradient(ellipse at 85% 5%, rgba(255,60,0,0.25) 0%, transparent 50%), radial-gradient(ellipse at 50% 100%, rgba(0,229,255,0.12) 0%, transparent 60%), linear-gradient(180deg, #0a0a1f 0%, #06061a 100%);
  --card-bg: #12122a;
  --card-bg-gradient: linear-gradient(145deg, #1e1e42 0%, #16162e 50%, #0b0b1c 100%);
  --panel-bg: #1a1a38;
  --primary: #ff3c00;
  --primary-dark: #a82100;
  --primary-light: #ff6b3d;
  --primary-glow: rgba(255, 60, 0, 0.65);
  --secondary: #00e5ff;
  --cyan: #00e5ff;
  --magenta: #ff00aa;
  --purple: #a855f7;
  --gold: #ffd700;
  --text-main: #f4f4ff;
  --text-muted: #8a8ab0;
  --border: #2a2a55;
  --ok: #10b981;
  --warn: #f59e0b;
  --bad: #ef4444;
  --grad: linear-gradient(180deg, #ff8555 0%, #ff3c00 48%, #d42e00 100%);
  --grad-deep: linear-gradient(135deg, #0d0d20 0%, #2a0a3a 100%);
  --nav-h: 74px;
  --font-head: 'Orbitron', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family: var(--font-body);background: var(--bg-gradient);background-attachment: fixed;color: var(--text-main);min-height: 100vh;font-size: 16px;line-height: 1.45;-webkit-font-smoothing: antialiased;overflow-x: hidden;background-color: var(--bg);}
img{max-width:100%;display:block}
button,input,select,textarea{font-family:var(--font-body);font-size:15px; font-weight: 600;}
button{cursor:pointer}
a{color:var(--secondary);text-decoration:none}
.app{max-width:540px;margin:0 auto;padding-bottom:calc(var(--nav-h) + 40px);min-height:100vh}

/* --- HEADER --- */
#appHeader{position:sticky;top:0;z-index:60;background:linear-gradient(180deg, rgba(10,10,30,0.98) 0%, rgba(10,10,25,0.92) 100%);backdrop-filter:blur(18px);border-bottom: 1px solid rgba(255,60,0,0.25);box-shadow: 0 6px 25px rgba(0,0,0,0.85);}
.hdr{max-width:540px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px; position:relative;height:70px;}
.hdr::after{content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);width: 55%; height: 2px; background: linear-gradient(90deg, transparent, var(--primary), var(--magenta), var(--primary), transparent);box-shadow: 0 0 14px var(--primary);}
.brand{display:flex;align-items:center;gap:11px;}
.logo{width:46px;height:50px;background:linear-gradient(145deg, #1a1a35, #0a0a1c);display:flex;align-items:center;justify-content:center;overflow:hidden;clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);border: 2px solid var(--primary);box-shadow: 0 0 20px var(--primary-glow);}
.logo img{width:100%;height:100%;object-fit:cover;}
.brand-name{font-family: var(--font-head); font-size:13px;font-weight:800;color:var(--text-main);}
.brand-sub{font-size:9px;font-weight:700;letter-spacing:2.5px;color:var(--secondary);margin-top:2px;}
.hdr-actions{display:flex;align-items:center;gap:12px}
.icon-btn{position:relative;width:42px;height:42px;border:1px solid var(--border);background: linear-gradient(180deg, #22224a 0%, #12122e 100%);display:grid;place-items:center;color:var(--text-main);border-radius: 10px;box-shadow: 0 4px 0 #0a0a1c, 0 6px 14px rgba(0,0,0,0.5);transition: transform .12s ease, box-shadow .12s ease;}
.icon-btn:active{transform:translateY(3px);box-shadow: 0 1px 0 #0a0a1c, 0 2px 6px rgba(0,0,0,0.5);}
.dot-badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background: linear-gradient(180deg, #ff5c2a, #d42e00);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg);}

.view{display:none;padding:14px 16px 10px}
.view.active{display:block;animation:fadeUp .3s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* --- CARDS --- */
.card-wrapper{position:relative;margin-bottom: 16px;filter:drop-shadow(0 12px 24px rgba(0,0,0,0.55));}
.card-wrapper::before{content: ''; position: absolute; inset: 0;background: linear-gradient(135deg, var(--primary) 0%, var(--magenta) 50%, var(--secondary) 100%);border-radius: 18px;z-index: -1;}
.card{background: var(--card-bg-gradient);border: 1px solid rgba(255,255,255,0.05);padding: 20px 18px;border-radius: 16px;}
.card-hero{ background: linear-gradient(135deg, #1a0a2e 0%, #0d0d20 60%, #2a0a1a 100%);position:relative; overflow:hidden; border:1px solid rgba(255,60,0,0.25); }

/* --- BUTTONS --- */
.btn{border:1px solid transparent;border-radius: 12px;padding:14px 20px;font-weight:800;font-size:15px;background: linear-gradient(180deg, #2a2a55 0%, #16162e 100%);color:var(--text-main);transition: all .1s;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow: 0 5px 0 #0a0a1c, 0 8px 16px rgba(0,0,0,0.5);}
.btn:active{transform:translateY(3px);box-shadow: 0 2px 0 #0a0a1c, 0 4px 8px rgba(0,0,0,0.5);}
.btn-primary{background: linear-gradient(180deg, #ff8555 0%, #ff3c00 48%, #d42e00 100%);color:#fff;box-shadow: 0 6px 0 #8b1f00, 0 10px 22px rgba(255,60,0,0.5);}
.btn-primary:active{transform:translateY(4px);box-shadow: 0 2px 0 #8b1f00, 0 4px 10px rgba(255,60,0,0.5);}
.btn-ghost{background: linear-gradient(180deg, #1e1e42 0%, #12122e 100%);border: 1px solid var(--border);}
.btn-danger{background: linear-gradient(180deg, #ff5555 0%, #dc2626 50%, #991b1b 100%);color:#fff;box-shadow: 0 5px 0 #7f1d1d;}
.btn-ok{background: linear-gradient(180deg, #34d399 0%, #10b981 50%, #047857 100%);color:#fff;box-shadow: 0 5px 0 #065f46;}
.btn-block{width:100%}
.btn-sm{padding:8px 12px; font-size:13px;}

/* --- BOTTOM NAV --- */
#bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:70;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg, rgba(16,16,38,0.98) 0%, rgba(8,8,22,0.98) 100%);backdrop-filter:blur(20px);border-top: 1px solid rgba(255,60,0,0.25);display:flex;justify-content:space-around;}
.nav-inner{max-width:540px;margin:0 auto;display:flex;width:100%}
.nav-item{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--text-muted);font-size:10px;font-weight:700;padding:8px 0;font-family: var(--font-head);}
.nav-item svg{fill: var(--text-muted);width: 24px; height: 24px;transition: all .25s;}
.nav-item.active{color:var(--primary);}
.nav-item.active svg{fill: var(--primary);transform: translateY(-2px) scale(1.1);}

/* Others */
.empty{text-align:center;padding:34px 16px;color:var(--text-muted)}
.avatar{border-radius:50%;object-fit:cover;border:2px solid var(--primary);}
.avatar-txt{display:grid;place-items:center;background: linear-gradient(145deg, #2a2a55, #12122e);color:var(--primary);font-weight:800;}
.input{width:100%;padding:13px 16px;border:1px solid var(--border);background: linear-gradient(180deg, #0a0a1c 0%, #12122e 100%);color:var(--text-main);outline:none;border-radius: 10px;}
.field{margin-bottom:14px}
.label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.flex{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
.modal{width:100%;max-width:540px;background: linear-gradient(180deg, #1a1a3a 0%, #0d0d20 100%);padding:20px 18px;max-height:88vh;overflow-y:auto;border-top-left-radius: 22px;border-top-right-radius: 22px;border-top: 2px solid var(--primary);}
.modal-head{font-family: var(--font-head); font-size:18px;color:var(--primary);margin-bottom:14px; text-transform: uppercase;}
.modal-foot{display:flex;gap:10px;margin-top:18px}
.modal-foot .btn{flex:1}
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:26px 18px 40px;max-width:540px;margin:0 auto}
.auth-logo{width:110px;height:126px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);border: 3px solid var(--primary);background:#0a0a1c;}
.tabs{display:flex;background: linear-gradient(180deg, #0a0a1c 0%, #12122e 100%);border:1px solid var(--border);padding:5px;margin-bottom:18px;border-radius: 12px;}
.tab{flex:1;border:none;background:none;padding:11px;font-weight:700;font-size:14px;color:var(--text-muted);border-radius: 8px;}
.tab.active{background: linear-gradient(180deg, #ff5c2a 0%, #d42e00 100%);color:#fff;}
</style>
</head>
<body>

<header id="appHeader" style="display:none">
  <div class="hdr">
    <div class="brand">
      <div class="logo"><img src="logo.jpg" alt="FF" onerror="this.style.display='none'; this.parentElement.innerHTML='FF';"></div>
      <div><div class="brand-name">FREE FIRE</div><div class="brand-sub">INDIA</div></div>
    </div>
    <div class="hdr-actions">
      <button class="icon-btn" onclick="go('notifications')">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="dot-badge" id="notifBadge" style="display:none">0</span>
      </button>
      <button class="icon-btn" onclick="go('profile')" id="hdrAvatar"></button>
    </div>
  </div>
</header>

<div class="app" id="appMain">
  <section class="view" id="view-auth">
    <div class="auth-wrap">
      <div class="auth-logo"><img src="logo.jpg" alt="FF Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='FF';"></div>
      <div style="text-align:center;font-family:var(--font-head);font-size:25px;margin-bottom:24px;color:#fff;text-shadow: 0 4px 12px rgba(0,0,0,0.7)">FREE FIRE INDIA</div>
      <div class="card-wrapper"><div class="card">
        <div class="tabs">
          <button class="tab active" id="tabLogin" onclick="setAuthTab('login')">Login</button>
          <button class="tab" id="tabRegister" onclick="setAuthTab('register')">Register</button>
        </div>
        <div id="authLoginForm">
          <div class="field"><label class="label">Mobile Number</label><input class="input" id="loginMobile" type="tel" maxlength="10"></div>
          <div class="field"><label class="label">Password</label><input class="input" id="loginPassword" type="password" maxlength="30"></div>
          <button class="btn btn-primary btn-block" onclick="directLogin()">LOGIN</button>
        </div>
        <div id="authRegisterForm" style="display:none">
          <div class="field"><label class="label">Full Name</label><input class="input" id="regName" maxlength="30"></div>
          <div class="field"><label class="label">Game Name</label><input class="input" id="regGame" maxlength="20"></div>
          <div class="field"><label class="label">FF UID</label><input class="input" id="regUid" type="tel" maxlength="12"></div>
          <div class="field"><label class="label">Mobile</label><input class="input" id="regMobile" type="tel" maxlength="10"></div>
          <div class="field"><label class="label">Password</label><input class="input" id="regPassword" type="password" maxlength="30"></div>
          <div class="field"><label class="label">Confirm Password</label><input class="input" id="regPassword2" type="password" maxlength="30"></div>
          <button class="btn btn-primary btn-block" onclick="directRegister()">CREATE ACCOUNT</button>
        </div>
        <div style="text-align:center;margin-top:16px"><a href="javascript:void(0)" onclick="forgotAccount()" style="color:var(--secondary);font-weight:700;font-size:13px">Forgot password / Reset</a></div>
      </div></div>
    </div>
  </section>

  <section class="view" id="view-home"></section>
  <section class="view" id="view-admin"></section>
  <section class="view" id="view-wallet"></section>
</div>

<nav id="bottomNav"><div class="nav-inner" id="navInner"></div></nav>
<div id="modalRoot"></div>

<script>
// ==========================================
// ১. ফায়ারবেস পুশ নোটিফিকেশন সেটআপ
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyC0dUv9cSB3mFTnvbSTZcqAzUPq3Uh5Dpo",
  authDomain: "ff-tournament-app-5d97f.firebaseapp.com",
  projectId: "ff-tournament-app-5d97f",
  storageBucket: "ff-tournament-app-5d97f.firebasestorage.app",
  messagingSenderId: "226818841603",
  appId: "1:226818841603:web:ebbdd465a46211e2908236"
};
const VAPID_KEY = "BAMFKzjWHNtaqAU7ADnXKsTQ-26pEhHXK_Gn-NXh_zA18lGcpStCtJqbR_l59vDRzV2ak70NjCXIvDPK633tdlI";

firebase.initializeApp(firebaseConfig);
const messaging = firebase.messaging();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/firebase-messaging-sw.js')
    .then((registration) => {
      return messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
    })
    .then((token) => {
      if (token) { localStorage.setItem('fcm_token', token); }
    })
    .catch((err) => { console.log('FCM Error:', err); });
}

messaging.onMessage((payload) => {
  alert(payload.notification.title + '\n\n' + payload.notification.body);
});

// ==========================================
// ২. অ্যাপের অন্যান্য লজিক (ডাটা সেভ করা)
// ==========================================
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9);
const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const ADMIN_MOBILE = '7699883020';
const ADMIN_PASSWORD = 'Amal2150';

function hashPassword(pwd) { let h = 5381; for (let i = 0; i < pwd.length; i++) { h = ((h << 5) + h) + pwd.charCodeAt(i); h |= 0; } return 'h' + Math.abs(h).toString(16); }

const DB_KEY = 'ffit_db_v4';
const SESSION_KEY = 'ffit_session_v4';
let DB = null;
let session = null;

function loadDB() {
  try { DB = JSON.parse(localStorage.getItem(DB_KEY)) || { users: [], tournaments: [], requests: [] }; } catch (e) { DB = { users: [], tournaments: [], requests: [] }; }
  if(!DB.users) DB.users = [];
  if(!DB.tournaments) DB.tournaments = [];
  if(!DB.requests) DB.requests = [];
  
  let adminUser = DB.users.find(u => u.mobile === ADMIN_MOBILE);
  if (!adminUser) {
    adminUser = { id: 'admin_1', name: 'Admin', gameName: 'ADMIN', ffUid: '000000', mobile: ADMIN_MOBILE, passwordHash: hashPassword(ADMIN_PASSWORD), role: 'admin', availCoins: 0 };
    DB.users.push(adminUser); saveDB();
  }
  session = JSON.parse(localStorage.getItem(SESSION_KEY));
  if (session && !DB.users.some(u => u.id === session.userId)) session = null;
}
function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function saveSession() { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }
function currentUser() { return session ? DB.users.find(u => u.id === session.userId) : null; }

function setAuthTab(tab) {
  $('#tabLogin').classList.toggle('active', tab === 'login');
  $('#tabRegister').classList.toggle('active', tab === 'register');
  $('#authLoginForm').style.display = tab === 'login' ? 'block' : 'none';
  $('#authRegisterForm').style.display = tab === 'register' ? 'block' : 'none';
}

function directLogin() {
  const mobile = $('#loginMobile').value.trim(), pwd = $('#loginPassword').value;
  const user = DB.users.find(u => u.mobile === mobile);
  if (!user || user.passwordHash !== hashPassword(pwd)) return alert('Invalid credentials');
  session = { userId: user.id }; saveSession();
  go(user.role === 'admin' ? 'admin' : 'home');
}

function directRegister() {
  const name = $('#regName').value.trim(), game = $('#regGame').value.trim(), ffUid = $('#regUid').value.trim(), mobile = $('#regMobile').value.trim(), pwd = $('#regPassword').value;
  if (!name || !game || !ffUid || !mobile || pwd.length < 4) return alert('Fill all fields correctly');
  if (DB.users.some(u => u.mobile === mobile)) return alert('Mobile already registered');
  const user = { id: uid('u'), name, gameName: game, ffUid, mobile, passwordHash: hashPassword(pwd), role: 'player', availCoins: 0, matches: 0, wins: 0 };
  DB.users.push(user); session = { userId: user.id }; saveDB(); saveSession();
  go('home');
}

function forgotAccount() {
  const html = `<div class="modal-head">Password Reset</div>
  <div style="font-size:14px;margin-bottom:14px;color:var(--text-muted)">Enter your details below. We will open WhatsApp with an automatic message so you can request a password reset from the admin.</div>
  <div class="field"><label class="label">Your Name</label><input class="input" id="fpName" maxlength="40" placeholder="Enter your name"></div>
  <div class="field"><label class="label">Free Fire UID</label><input class="input" id="fpUid" inputmode="numeric" maxlength="12" placeholder="6-12 digit Free Fire UID"></div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">CANCEL</button><button class="btn btn-ok" onclick="sendForgotWhatsApp()">SEND VIA WHATSAPP</button></div>`;
  $('#modalRoot').innerHTML = '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">' + html + '</div></div>';
}
function sendForgotWhatsApp() {
  const name = $('#fpName').value.trim(), ffUid = $('#fpUid').value.trim();
  if (name.length < 2 || !/^\d{6,12}$/.test(ffUid)) return alert('Enter valid Name and UID');
  const message = 'Hello Admin 👋\n\n📱 App: Free Fire India Tournament\n👤 Name: ' + name + '\n🎮 FF UID: ' + ffUid + '\n\n🔑 Please forget my password and help me reset it.\n\nThank you!';
  window.open('https://wa.me/917699883020?text=' + encodeURIComponent(message), '_blank'); closeModal();
}
window.closeModal = function() { $('#modalRoot').innerHTML = ''; };

function go(view) {
  if (!currentUser() && view !== 'auth') view = 'auth';
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  $('#appHeader').style.display = view === 'auth' ? 'none' : 'block';
  $('#bottomNav').style.display = (view === 'auth' || view === 'admin') ? 'none' : 'block';
  
  const u = currentUser();
  if (view === 'home') {
    $('#view-home').innerHTML = `<div class="card-wrapper" style="margin-top:20px"><div class="card">
      <div class="flex" style="gap:12px"><div class="avatar avatar-txt" style="width:54px;height:54px;font-size:20px">${esc(u.name[0])}</div>
      <div><div class="bold" style="font-size:18px">${esc(u.name)}</div><div style="font-size:13px;color:var(--text-muted)">${esc(u.gameName)} · UID ${esc(u.ffUid)}</div></div></div>
      <div class="grid3" style="margin-top:16px"><div class="stat-card"><div class="stat-v">${u.matches||0}</div><div class="stat-l">Matches</div></div><div class="stat-card"><div class="stat-v">${u.wins||0}</div><div class="stat-l">Wins</div></div><div class="stat-card"><div class="stat-v">₹${u.availCoins||0}</div><div class="stat-l">Wallet</div></div></div>
    </div></div>`;
  } else if (view === 'admin') {
    $('#view-admin').innerHTML = `<div style="padding:20px 0"><div class="bold" style="font-size:20px;color:var(--primary)">ADMIN DASHBOARD</div></div>
    <div class="card-wrapper"><div class="card">
      <div class="bold" style="margin-bottom:10px">Test Notification</div>
      <button class="btn btn-primary btn-block" onclick="alert('নোটিফিকেশন পাঠাতে Firebase Console -> Messaging এ যান।')">How to Send?</button>
      <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="session=null;saveSession();go('auth')">Logout</button>
    </div></div>`;
  }
}

function init() {
  loadDB();
  const navItems = [{ key: 'home', label: 'HOME' }, { key: 'admin', label: 'ADMIN' }];
  $('#navInner').innerHTML = navItems.map(n => `<button class="nav-item" onclick="go('${n.key}')"><span>${n.label}</span></button>`).join('');
  go(currentUser() ? (currentUser().role === 'admin' ? 'admin' : 'home') : 'auth');
}
window.go = go;
window.directLogin = directLogin;
window.directRegister = directRegister;
window.forgotAccount = forgotAccount;
window.sendForgotWhatsApp = sendForgotWhatsApp;
window.setAuthTab = setAuthTab;

init();
</script>
</body>
</html>
